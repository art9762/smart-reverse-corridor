# Eclipse Mosquitto config — DEV ONLY
# Anonymous listeners are enabled for local development.
# For production: enable auth (passwords/ACL), TLS on 8883/9001, and
# bind only on the internal network. See infra/README.md.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Plain MQTT for services and CLI clients
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket MQTT for the web dashboard (mqtt.js in browser)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
