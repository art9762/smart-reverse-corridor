[pytest]
minversion = 8.0
testpaths = tests
asyncio_mode = auto
markers =
    integration: integration tests that need mosquitto + controller (run with -m integration)
    slow: long-running scenarios (>=30s wallclock)
filterwarnings =
    ignore::DeprecationWarning
# Fail fast in CI; integration tests assert on contract messages.
addopts = -ra --strict-markers --tb=short
timeout = 180
