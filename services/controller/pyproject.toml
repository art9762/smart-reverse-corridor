[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controller"
version = "0.1.0"
description = "Smart Reverse Corridor — adaptive phase FSM controller"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Smart Reverse Corridor Team" }]
license = { text = "MIT" }
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "paho-mqtt==2.1.0",
    "transitions==0.9.2",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "sqlmodel==0.0.19",
    "influxdb-client==1.43.0",
    "websockets==12.0",
    "structlog==24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "httpx==0.27.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
