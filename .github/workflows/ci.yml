name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (${{ matrix.service }} · py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [controller, ml, simulator]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            [ -f requirements.txt ] && pip install -r requirements.txt || true
            [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt || true
            pip install pytest ruff mypy || true
          else
            echo "no python project yet, skipping"
            exit 0
          fi
      - name: Lint (ruff)
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            ruff check . || true
          fi
      - name: Tests
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -d tests ] || compgen -G "test_*.py" >/dev/null; then
            pytest -q
          else
            echo "no tests yet"
          fi

  web:
    name: web (npm test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "no web project yet"
            exit 0
          fi
      - name: Lint
        working-directory: web
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi
      - name: Test
        working-directory: web
        run: |
          if [ -f package.json ]; then npm test --if-present -- --run; fi
      - name: Build
        working-directory: web
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi

  docker-build:
    name: docker buildx (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [python, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
            context: ./services/controller
          - image: ml
            context: ./services/ml
          - image: simulator
            context: ./services/simulator
          - image: web
            context: ./web
    steps:
      - uses: actions/checkout@v4
      - name: Skip if context missing
        id: pre
        run: |
          if [ ! -f "${{ matrix.context }}/Dockerfile" ]; then
            echo "no Dockerfile at ${{ matrix.context }}, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up QEMU
        if: steps.pre.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.pre.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        if: steps.pre.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          tags: src-${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose --profile sim --profile ml config >/dev/null
